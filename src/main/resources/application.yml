spring:
  application:
    name: spring-boot-job-monitor
  datasource:
    url: jdbc:postgresql://localhost:5432/exchange_db
    username: exchange_user
    password: exchange_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: localhost
      port: 6379

exchange:
  engine:
    matching-threads: 4
    matching-threads-max: 8
    matching-threads-queue: 100
    scheduler-threads: 3
